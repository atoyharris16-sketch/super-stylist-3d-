<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💖 Super Stylist</title>
<style>
/* ============ Super Stylist — realistic 2D fashion-doll dress-up ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#fff7fb 0%,#ffeef6 60%,#fde8f3 100%);
  color:#6b4a5e;touch-action:manipulation;min-height:100vh;
}
.app{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 2px 10px}
.topbar h1{font-size:22px;margin:0 auto 0 0;letter-spacing:.5px;color:#c2437f}
.iconbtn{
  min-width:48px;min-height:48px;padding:8px 12px;border-radius:16px;cursor:pointer;
  border:2px solid #ffd3e6;background:#fff;font-size:20px;line-height:1;color:#a04a72;
  box-shadow:0 2px 6px rgba(194,67,127,.12);transition:transform .08s;
}
.iconbtn:active{transform:scale(.93)}
.iconbtn.wide{font-size:15px;font-weight:700}
/* ---------- layout ---------- */
main{display:flex;flex-direction:column;gap:12px}
.stage-card{background:#fff;border-radius:26px;padding:12px;box-shadow:0 8px 28px rgba(194,67,127,.14)}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#ffe3ef}
#dollSvg{display:block;width:100%;height:auto;max-height:54vh;margin:0 auto}
.name-row{display:flex;gap:8px;margin-top:10px;align-items:center}
#nameInput{
  flex:1;min-height:48px;border-radius:14px;border:2px solid #ffd3e6;padding:0 14px;
  font-size:16px;font-family:inherit;color:#6b4a5e;background:#fff8fc;min-width:0;
}
.plaque{
  margin-top:8px;text-align:center;font-weight:800;font-size:18px;color:#c2437f;
  background:linear-gradient(180deg,#fff,#ffeef6);border:2px solid #ffd3e6;border-radius:14px;
  padding:8px;min-height:44px;
}
/* ---------- wardrobe ---------- */
.wardrobe{background:#fff;border-radius:26px;padding:12px;box-shadow:0 8px 28px rgba(194,67,127,.14);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.tab{
  flex:0 0 auto;min-width:72px;min-height:60px;border-radius:16px;border:2px solid #ffe0ee;background:#fff8fc;
  font-size:24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:#a04a72;padding:6px 8px;
}
.tab small{font-size:11px;font-weight:700}
.tab.sel{border-color:#ff8fb3;background:#ffe9f3;box-shadow:0 0 0 2px #ffb3cd}
.dots{display:none;gap:10px;flex-wrap:wrap;padding:4px 2px 10px}
.dots.show{display:flex}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #ffd3e6;cursor:pointer;padding:0}
.dot.sel{box-shadow:0 0 0 3px #ff8fb3}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;max-height:38vh;padding:2px;-webkit-overflow-scrolling:touch}
.opt{
  min-height:68px;border-radius:16px;border:2px solid #ffe0ee;background:#fff8fc;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:26px;color:#a04a72;padding:8px 4px;
}
.opt small{font-size:12px;font-weight:700;text-align:center;line-height:1.15}
.opt.sel{border-color:#ff8fb3;background:#ffe9f3;box-shadow:0 0 0 2px #ffb3cd}
/* ---------- sparkles ---------- */
#sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark{position:absolute;font-size:18px;pointer-events:none;animation:sparkFloat .8s ease-out forwards;z-index:5}
@keyframes sparkFloat{0%{transform:translateY(0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-70px) scale(1.2) rotate(40deg);opacity:0}}
/* ---------- doll idle life (SVG) ---------- */
#dollRoot .breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
#dollRoot .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
#dollRoot .sway{transform-box:fill-box;transform-origin:50% 0%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
/* ---------- desktop / tablet ---------- */
@media(min-width:900px){
  main{flex-direction:row;align-items:flex-start}
  .stage-card{flex:1.15;position:sticky;top:12px}
  #dollSvg{max-height:80vh}
  .wardrobe{flex:1;max-height:calc(100vh - 120px)}
  .options{max-height:none;flex:1}
  .topbar h1{font-size:26px}
}
@media(prefers-reduced-motion:reduce){
  #dollRoot .breathe,#dollRoot .eyes,#dollRoot .sway{animation:none}
  .spark{animation-duration:.01s}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>💖 Super Stylist</h1>
    <button class="iconbtn" id="soundBtn" aria-label="Sound on or off">🔊</button>
    <button class="iconbtn wide" id="surpriseBtn" aria-label="Surprise me">🎲 Surprise</button>
    <button class="iconbtn" id="resetBtn" aria-label="Start over">↺</button>
    <button class="iconbtn" id="saveBtn" aria-label="Save picture">📸</button>
  </header>
  <main>
    <section class="stage-card">
      <div class="stage" id="stage">
        <svg id="dollSvg" viewBox="0 0 400 780" role="img" aria-label="Your doll"></svg>
        <div id="sparkles" aria-hidden="true"></div>
      </div>
      <div class="name-row">
        <input id="nameInput" maxlength="16" placeholder="Name your doll… 💕" aria-label="Doll's name">
      </div>
      <div class="plaque" id="plaque">💖 Your Doll 💖</div>
    </section>
    <section class="wardrobe" aria-label="Wardrobe">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="dots" id="colorRow"></div>
      <div class="options" id="options"></div>
    </section>
  </main>
</div>
<script>
"use strict";
/* =====================================================================
   Super Stylist — data-driven SVG fashion doll
   Layers (back→front): scene | backHair | body | baseClothes | face |
                        frontHair | dress OR top+bottom | socks | shoes |
                        jewelry | extras
   Doll canvas: viewBox 0 0 400 780. Head center (200,105).
   ===================================================================== */

/* ---------------- palettes ---------------- */
const SKINS=[ // base, shadow, highlight — subtle, never flat
  {name:"Peachy",  base:"#ffd9c2", shadow:"#eebd9c", hi:"#fff0e2"},
  {name:"Honey",   base:"#f7c39a", shadow:"#dda06f", hi:"#ffe4c8"},
  {name:"Tan",     base:"#e0a878", shadow:"#c08454", hi:"#f7cfa4"},
  {name:"Golden",  base:"#c98d5f", shadow:"#a56c42", hi:"#e8b285"},
  {name:"Amber",   base:"#a06a42", shadow:"#7e4f2d", hi:"#c49163"},
  {name:"Cocoa",   base:"#7a4c2e", shadow:"#5c3720", hi:"#a06c48"}
];
const HAIRS=[ // base / shadow / highlight trios — hair must look like HAIR
  {name:"Black",  base:"#2e2622", shadow:"#161210", hi:"#7a6a60"},
  {name:"Choco",  base:"#4a3122", shadow:"#2b1c12", hi:"#8f6b4e"},
  {name:"Caramel",base:"#8a5a33", shadow:"#5f3a1e", hi:"#c99a63"},
  {name:"Blonde", base:"#d3a24f", shadow:"#96702c", hi:"#f4d68d"},
  {name:"Ginger", base:"#b85c2c", shadow:"#7e3a18", hi:"#ec9c5e"},
  {name:"Pink",   base:"#e78fb3", shadow:"#ad5c83", hi:"#f9c8dc"},
  {name:"Purple", base:"#8e6cc9", shadow:"#5c408f", hi:"#c6adee"}
];
const EYECOLORS=[
  {name:"Brown", c:"#6b4226"},{name:"Hazel", c:"#8a6b32"},{name:"Green", c:"#4e8f5b"},
  {name:"Blue",  c:"#4a7fc9"},{name:"Gray",  c:"#7d8a99"},{name:"Violet",c:"#7a5fc0"},
  {name:"Pink",  c:"#c05f8f"}
];
const EYESTYLES=["Natural","Happy","Starry","Sleepy","Wink"];
const BROWS=["Soft","Straight","Arched","Thick","Tiny"];
const HAIRSTYLES=["Bob","Pigtails","Braids","Curls","Buns","Ponytail"];
const SCENES=["Candy","Ocean","Meadow","Starry","Rainbow"];

/* ---------------- state ---------------- */
const DEFAULTS={skin:1,eyeStyle:0,eyeColor:3,brow:0,hairStyle:3,hairColor:2,
  dress:-1,top:0,bottom:0,shoes:0,socks:-1,
  necklace:false,earrings:false,bracelet:false,
  tiara:false,catEars:false,shades:false,handbag:false,wings:false,
  scene:0,name:"",sound:true};
let S=JSON.parse(JSON.stringify(DEFAULTS));
let curTab="hair";

/* ---------------- tiny helpers ---------------- */
const $=id=>document.getElementById(id);
const mir=(inner)=>`<g transform="translate(400,0) scale(-1,1)">${inner}</g>`; // mirror left→right
function shade(hex,amt){ // amt -1..1 darken/lighten
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------------- SVG defs (rebuilt each render so skin tones swap) ---------------- */
function buildDefs(){
  const sk=SKINS[S.skin];
  return `<defs>
    <radialGradient id="skinFace" cx="42%" cy="35%" r="75%">
      <stop offset="0%" stop-color="${sk.hi}"/><stop offset="55%" stop-color="${sk.base}"/><stop offset="100%" stop-color="${sk.shadow}"/>
    </radialGradient>
    <linearGradient id="skinBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${shade(sk.base,.06)}"/><stop offset="60%" stop-color="${sk.base}"/><stop offset="100%" stop-color="${sk.shadow}"/>
    </linearGradient>
    <linearGradient id="skinLimb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${sk.shadow}" stop-opacity=".55"/><stop offset="35%" stop-color="${sk.base}"/><stop offset="100%" stop-color="${sk.shadow}" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="blushG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fa8" stop-opacity=".55"/><stop offset="100%" stop-color="#ff8fa8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="irisShade" cx="50%" cy="42%" r="65%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="gemG" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".95"/><stop offset="45%" stop-color="#ffd166"/><stop offset="100%" stop-color="#e09b2d"/>
    </radialGradient>
    <linearGradient id="fabricShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".28"/><stop offset="55%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
  </defs>`;
}

/* ---------------- scenes ---------------- */
function buildScene(){
  const i=S.scene;let bg="",decor="",ground="";
  const fl=(n,fn)=>{let s="";for(let k=0;k<n;k++)s+=fn(k);return s;};
  if(i===0){ // Candy
    bg=`<linearGradient id="scbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe3f1"/><stop offset="100%" stop-color="#ffc4de"/></linearGradient>`;
    decor=fl(9,k=>`<text x="${30+k*38}" y="${90+((k*53)%420)}" font-size="${20+(k%3)*8}" opacity=".55">💗</text>`)
         +fl(7,k=>`<circle cx="${40+k*52}" cy="${140+((k*97)%380)}" r="${5+(k%3)*4}" fill="#fff" opacity=".5"/>`);
    ground=`<ellipse cx="200" cy="726" rx="150" ry="26" fill="#f7a8c9" opacity=".55"/>`;
  }else if(i===1){ // Ocean
    bg=`<linearGradient id="scbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cdeeff"/><stop offset="100%" stop-color="#8fd0f5"/></linearGradient>`;
    decor=fl(12,k=>`<circle cx="${25+k*33}" cy="${80+((k*71)%420)}" r="${4+(k%4)*3}" fill="#fff" opacity=".45"/>`)
         +fl(5,k=>`<text x="${45+k*75}" y="${200+((k*40)%300)}" font-size="22" opacity=".6">🐚</text>`);
    ground=`<ellipse cx="200" cy="726" rx="150" ry="26" fill="#5ea9dd" opacity=".5"/><path d="M40 700 q40 -18 80 0 t80 0 t80 0 t80 0" stroke="#fff" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>`;
  }else if(i===2){ // Meadow
    bg=`<linearGradient id="scbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e4f9d4"/><stop offset="100%" stop-color="#b5e8a4"/></linearGradient>`;
    decor=`<circle cx="330" cy="110" r="34" fill="#ffe066"/><circle cx="330" cy="110" r="46" fill="#ffe066" opacity=".25"/>`
      +fl(8,k=>`<text x="${30+k*44}" y="${150+((k*89)%380)}" font-size="24" opacity=".8">🌼</text>`);
    ground=`<ellipse cx="200" cy="726" rx="160" ry="30" fill="#7cc46f" opacity=".6"/>`;
  }else if(i===3){ // Starry night
    bg=`<linearGradient id="scbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#33325e"/><stop offset="100%" stop-color="#14142e"/></linearGradient>`;
    decor=`<circle cx="320" cy="100" r="28" fill="#fdf6d8"/><circle cx="310" cy="92" r="24" fill="#33325e" opacity=".9"/>`
      +fl(26,k=>`<circle cx="${(k*67)%400}" cy="${(k*113)%560}" r="${1.5+(k%3)}" fill="#fff" opacity="${.5+(k%4)*.12}"/>`)
      +fl(6,k=>`<text x="${(k*97)%360}" y="${120+((k*151)%420)}" font-size="16" opacity=".9">✨</text>`);
    ground=`<ellipse cx="200" cy="726" rx="150" ry="26" fill="#23234a" opacity=".8"/>`;
  }else{ // Rainbow
    bg=`<linearGradient id="scbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffdfe4"/><stop offset="25%" stop-color="#fff3c4"/><stop offset="50%" stop-color="#d9f4c9"/><stop offset="75%" stop-color="#cfe8ff"/><stop offset="100%" stop-color="#e3d4ff"/></linearGradient>`;
    decor=fl(4,k=>`<g opacity=".8"><ellipse cx="${70+k*95}" cy="${110+(k%2)*40}" rx="34" ry="16" fill="#fff"/><ellipse cx="${70+k*95}" cy="${116+(k%2)*40}" rx="26" ry="11" fill="#fff"/></g>`);
    ground=`<ellipse cx="200" cy="726" rx="155" ry="28" fill="#fff" opacity=".55"/>`;
  }
  return `<defs>${bg}</defs><rect x="0" y="0" width="400" height="780" fill="url(#scbg)"/>${decor}${ground}`;
}

/* ---------------- body (skin + base underclothes) ---------------- */
function buildBody(){
  const sk=SKINS[S.skin];
  // legs (left drawn, right mirrored)
  const legL=`
    <path d="M168 344 C164 420 166 505 172 596 L171 612 Q171 622 182 622 L191 622 Q200 622 199 612 L197 596 C195 505 193 420 191 346 Z" fill="url(#skinLimb)"/>
    <path d="M169 614 L198 614 L203 638 Q204 650 192 650 L177 650 Q166 650 167 639 Z" fill="url(#skinBody)"/>`;
  // arms (left drawn, right mirrored)
  const armL=`
    <path d="M158 214 C147 244 139 302 133 358 Q132 370 142 371 Q151 372 153 361 C160 308 167 252 174 222 Z" fill="url(#skinLimb)"/>
    <circle cx="142" cy="376" r="10" fill="url(#skinBody)"/>`;
  return `<g class="breathe">
    ${legL}${mir(legL)}
    <path d="M187 158 L187 196 Q200 205 213 196 L213 158 Z" fill="url(#skinBody)"/>
    <ellipse cx="200" cy="170" rx="15" ry="6" fill="${sk.shadow}" opacity=".3"/>
    <path d="M150 208 C162 198 181 194 200 194 C219 194 238 198 250 208 L244 296 C242 326 224 342 200 342 C176 342 158 326 156 296 Z" fill="url(#skinBody)"/>
    ${armL}${mir(armL)}
    <path d="M144 108 m-9 0 a9 12 0 1 0 18 0 a9 12 0 1 0 -18 0" fill="url(#skinFace)"/>
    <path d="M256 108 m-9 0 a9 12 0 1 0 18 0 a9 12 0 1 0 -18 0" fill="url(#skinFace)"/>
    <path d="M200 42 C244 42 261 76 257 112 C253 150 228 170 200 170 C172 170 147 150 143 112 C139 76 156 42 200 42 Z" fill="url(#skinFace)"/>
    <ellipse cx="200" cy="168" rx="16" ry="5" fill="${sk.shadow}" opacity=".22"/>
    <!-- base underclothes: cream camisole + shorts (doll is never bare) -->
    <path d="M158 234 Q179 218 200 230 Q221 218 242 234 L238 292 C236 318 220 332 200 332 C180 332 164 318 162 292 Z" fill="#fdf6ec"/>
    <path d="M158 234 Q179 218 200 230 Q221 218 242 234 L238 292 C236 318 220 332 200 332 C180 332 164 318 162 292 Z" fill="url(#fabricShade)"/>
    <rect x="164" y="202" width="10" height="34" rx="5" fill="#fdf6ec"/>
    <rect x="226" y="202" width="10" height="34" rx="5" fill="#fdf6ec"/>
    <path d="M162 330 L238 330 L243 388 Q200 400 157 388 Z" fill="#f6ecdc"/>
    <path d="M162 330 L238 330 L243 388 Q200 400 157 388 Z" fill="url(#fabricShade)"/>
  </g>`;
}

/* ---------------- face: natural almond eyes, soft brows ---------------- */
function eyeWhite(){return `<path d="M-17 0 Q0 -12 17 0 Q0 12 -17 0 Z" fill="#fff"/>`;}
function iris(cx,cy,r,color){
  return `<g>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#irisShade)"/>
    <circle cx="${cx}" cy="${cy+1}" r="${r*0.48}" fill="#1c1310"/>
    <circle cx="${cx-r*0.32}" cy="${cy-r*0.36}" r="${r*0.24}" fill="#fff" opacity=".95"/>
  </g>`;
}
function lashLine(){return `<path d="M-17 0 Q0 -12 17 0" stroke="#3a2a22" stroke-width="3" fill="none" stroke-linecap="round"/>`;}
function buildEye(style,color,isLeft){
  const c=color.c;
  if(style===1) return `<path d="M-15 3 Q0 -11 15 3" stroke="#3a2a22" stroke-width="4.5" fill="none" stroke-linecap="round"/>`; // happy
  if(style===4 && !isLeft) return `<path d="M-15 3 Q0 -11 15 3" stroke="#3a2a22" stroke-width="4.5" fill="none" stroke-linecap="round"/>`; // wink (right closed)
  let inner=eyeWhite()+iris(0,0.5,8,c)+lashLine();
  if(style===2) inner+=`<text x="-9" y="-4" font-size="9">✦</text><text x="4" y="5" font-size="7">✦</text>`; // starry
  if(style===3) inner+=`<path d="M-17 -2 Q0 -8 17 -2 L17 -14 L-17 -14 Z" fill="#f3c9a8" opacity=".0"/><path d="M-17 -1 Q0 -6 17 -1" stroke="#3a2a22" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-10 4 l-3 4 M0 6 l0 5 M10 4 l3 4" stroke="#3a2a22" stroke-width="1.6" stroke-linecap="round"/>`; // sleepy lid
  return inner;
}
function buildBrows(){
  const hc=HAIRS[S.hairColor].base;
  const P=["M-14 2 Q0 -7 14 -2","M-14 0 L14 -1","M-14 3 Q0 -11 14 -1","M-14 2 Q0 -7 14 -2","M-9 1 Q0 -4 9 -1"];
  const W=[4,4,4,7.5,3.5];
  const d=P[S.brow],w=W[S.brow];
  return `<g stroke="${hc}" stroke-width="${w}" fill="none" stroke-linecap="round" opacity=".92">
    <g transform="translate(176,80)"><path d="${d}"/></g>
    <g transform="translate(224,80)"><path d="${d}"/></g></g>`;
}
function buildFace(){
  const ec=EYECOLORS[S.eyeColor];
  const eL=`<g class="eyes" transform="translate(176,110)">${buildEye(S.eyeStyle,ec,true)}</g>`;
  const eR=`<g class="eyes" transform="translate(224,110)">${buildEye(S.eyeStyle,ec,false)}</g>`;
  return `<g>
    <ellipse cx="161" cy="136" rx="11" ry="7" fill="url(#blushG)"/>
    <ellipse cx="239" cy="136" rx="11" ry="7" fill="url(#blushG)"/>
    <path d="M200 126 q4 5 -1 8" stroke="#b98a6a" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M187 148 Q200 157 213 148" stroke="#b65c5c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    ${buildBrows()}${eL}${eR}
  </g>`;
}

/* ---------------- HAIR — layered strands: base + shadow + highlight ----------------
   Every style returns {back, front}. Strand lines keep it from looking like a helmet. */
function hairStrands(paths,color,sw,op){
  return `<g stroke="${color}" stroke-width="${sw}" fill="none" stroke-linecap="round" opacity="${op}">${paths.map(p=>`<path d="${p}"/>`).join("")}</g>`;
}
function buildHair(){
  const H=HAIRS[S.hairColor],B=H.base,Sh=H.shadow,Hi=H.hi;
  const fringe=`<path d="M145 102 Q148 52 200 47 Q252 52 255 102 Q244 76 230 84 Q216 62 200 70 Q184 62 170 84 Q156 76 145 102 Z" fill="${B}"/>`
    +hairStrands(["M170 62 Q168 78 172 92","M200 58 Q200 76 200 90","M230 62 Q232 78 228 92"],Sh,2,.5)
    +hairStrands(["M160 58 Q180 50 200 50","M215 52 Q232 56 242 64"],Hi,3.5,.55);
  const sideL=`<path d="M146 96 C139 130 141 166 150 192 L163 187 C156 160 155 124 159 98 Z" fill="${B}"/>`;
  const sideR=mir(sideL);
  let back="",front=fringe+sideL+sideR;
  const shine=(p)=>hairStrands(p,Hi,4,.5);
  const strands=(p)=>hairStrands(p,Sh,2,.45);

  if(S.hairStyle===0){ // ---- BOB ----
    back=`<g class="sway"><path d="M200 16 C146 16 124 58 129 110 C132 146 126 176 136 202 Q168 214 200 212 Q232 214 264 202 C274 176 268 146 271 110 C276 58 254 16 200 16 Z" fill="${B}"/>`

function optBtn(icon,label,sel,fn){
  const b=document.createElement("button");
  b.className="opt"+(sel?" sel":"");b.innerHTML=`<span>${icon}</span><small>${label}</small>`;
  b.setAttribute("aria-pressed",sel?"true":"false");
  b.addEventListener("click",()=>{fn();render();renderOptions();renderColors();sparkle();pop();});
  return b;
}
function renderTabs(){
  const t=$("tabs");t.innerHTML="";
  TABS.forEach(tab=>{
    const b=document.createElement("button");
    b.className="tab"+(curTab===tab.id?" sel":"");b.setAttribute("role","tab");
    b.setAttribute("aria-selected",curTab===tab.id?"true":"false");
    b.innerHTML=`<span>${tab.icon}</span><small>${tab.label}</small>`;
    b.addEventListener("click",()=>{curTab=tab.id;renderTabs();renderOptions();renderColors();pop();});
    t.appendChild(b);
  });
}
function renderColors(){
  const tab=TABS.find(t=>t.id===curTab),row=$("colorRow");row.innerHTML="";
  if(!tab||!tab.colors){row.classList.remove("show");return;}
  row.classList.add("show");
  const kind=tab.colors;
  const list=kind==="skin"?SKINS:kind==="eyeColor"?EYECOLORS:HAIRS;
  list.forEach((c,i)=>{
    const d=document.createElement("button");
    d.className="dot"+(S[kind]===i?" sel":"");d.style.background=c.c||c.base;
    d.setAttribute("aria-label",c.name);
    d.addEventListener("click",()=>{S[kind]=i;render();renderColors();sparkle();pop();});
    row.appendChild(d);
  });
}
function renderOptions(){
  const o=$("options");o.innerHTML="";
  const add=(icon,label,sel,fn)=>o.appendChild(optBtn(icon,label,sel,fn));
  if(curTab==="skin"){o.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:18px;opacity:.75">Pick a skin tone above 👆</div>`;}
  else if(curTab==="eyes"){EYESTYLES.forEach((n,i)=>add(["👁️","😊","🌟","😴","😉"][i],n,S.eyeStyle===i,()=>{S.eyeStyle=i;}));}
  else if(curTab==="brows"){BROWS.forEach((n,i)=>add("🤨",n,S.brow===i,()=>{S.brow=i;}));}
  else if(curTab==="hair"){HAIRSTYLES.forEach((n,i)=>add(HAIR_ICONS[i],n,S.hairStyle===i,()=>{S.hairStyle=i;}));}
  else if(curTab==="dresses"){DRESS_OPTS.forEach((d,i)=>add(d.icon,d.label,S.dress===i-1,()=>{S.dress=i-1;}));}
  else if(curTab==="tops"){TOP_OPTS.forEach((t,i)=>add(t.icon,t.label,S.dress<0&&S.top===i,()=>{S.top=i;S.dress=-1;}));}
  else if(curTab==="bottoms"){BOTTOM_OPTS.forEach((b,i)=>add(b.icon,b.label,S.dress<0&&S.bottom===i,()=>{S.bottom=i;S.dress=-1;}));}
  else if(curTab==="shoes"){SHOE_OPTS.forEach((s,i)=>add(s.icon,s.label,S.shoes===i,()=>{S.shoes=i;}));}
  else if(curTab==="socks"){SOCK_OPTS.forEach((s,i)=>add(s.icon,s.label,S.socks===i-1,()=>{S.socks=i-1;}));}
  else if(curTab==="jewelry"){JEWEL_OPTS.forEach(j=>add(j.icon,j.label,S[j.k],()=>{S[j.k]=!S[j.k];}));}
  else if(curTab==="extras"){EXTRA_OPTS.forEach(e=>add(e.icon,e.label,S[e.k],()=>{S[e.k]=!S[e.k];}));}
  else if(curTab==="scene"){SCENE_OPTS.forEach((s,i)=>add(s.icon,s.label,S.scene===i,()=>{S.scene=i;}));}
}

/* ---------------- sound + sparkles ---------------- */
let AC=null;
function pop(){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="triangle";o.frequency.value=500+Math.random()*280;
    g.gain.setValueAtTime(.16,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.18);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.2);
  }catch(e){}
}
function sparkle(){
  const box=$("sparkles");
  for(let k=0;k<12;k++){
    const s=document.createElement("span");s.className="spark";
    s.textContent=["✨","💖","⭐","💕"][k%4];
    s.style.left=(18+Math.random()*64)+"%";s.style.top=(12+Math.random()*55)+"%";
    s.style.fontSize=(14+Math.random()*14)+"px";
    box.appendChild(s);setTimeout(()=>s.remove(),850);
  }
}

/* ---------------- actions ---------------- */
function surprise(){
  const R=n=>Math.floor(Math.random()*n);
  S.skin=R(6);S.eyeStyle=R(5);S.eyeColor=R(7);S.brow=R(5);
  S.hairStyle=R(6);S.hairColor=R(7);
  if(Math.random()<.45){S.dress=R(3);}else{S.dress=-1;S.top=R(3);S.bottom=R(3);}
  S.shoes=R(6);S.socks=Math.random()<.5?R(5):-1;
  S.necklace=Math.random()<.5;S.earrings=Math.random()<.5;S.bracelet=Math.random()<.4;
  S.tiara=Math.random()<.25;S.catEars=Math.random()<.2;S.shades=Math.random()<.2;
  S.handbag=Math.random()<.3;S.wings=Math.random()<.25;S.scene=R(5);
  render();renderOptions();renderColors();sparkle();pop();
}
function resetAll(){
  const snd=S.sound,nm=S.name;
  S=JSON.parse(JSON.stringify(DEFAULTS));S.sound=snd;S.name=nm;
  render();renderOptions();renderColors();pop();
}
function savePNG(){
  try{
    const svg=$("dollSvg"),clone=svg.cloneNode(true);
    clone.setAttribute("width","800");clone.setAttribute("height","1560");
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    const xml=new XMLSerializer().serializeToString(clone);
    const url=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml;charset=utf-8"}));
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");c.width=800;c.height=1560;
      c.getContext("2d").drawImage(img,0,0,800,1560);URL.revokeObjectURL(url);
      const nm=(S.name||"my-doll").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"my-doll";
      const a=document.createElement("a");a.download=`super-stylist-${nm}.png`;
      a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();pop();
    };
    img.onerror=()=>URL.revokeObjectURL(url);
    img.src=url;
  }catch(e){}
}

/* ---------------- init ---------------- */
$("soundBtn").addEventListener("click",()=>{S.sound=!S.sound;$("soundBtn").textContent=S.sound?"🔊":"🔇";pop();});
$("surpriseBtn").addEventListener("click",surprise);
$("resetBtn").addEventListener("click",resetAll);
$("saveBtn").addEventListener("click",savePNG);
$("nameInput").addEventListener("input",e=>{
  S.name=e.target.value;$("plaque").textContent=S.name?`💖 ${S.name} 💖`:"💖 Your Doll 💖";
});
renderTabs();renderOptions();renderColors();render();
</script>
